# Static site: no build step, publish the site/ folder as-is.
[build]
  publish = "site"
  command = ""

# Keep the .html URLs exactly as Google has them indexed (no "pretty URL" rewriting).
[build.processing.html]
  pretty_urls = false

# Long cache for images; they never change in place (new image = new filename).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# www -> apex, so there is one canonical host.
[[redirects]]
  from = "https://www.detlingsdetailing.com/*"
  to = "https://detlingsdetailing.com/:splat"
  status = 301
  force = true
